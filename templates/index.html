<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Northstar Support Deflection Chatbot MVP. Instantly track your order status, check catalog stock levels, and escalate issues.">
    <title>Northstar Support Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="app-container">

        <!-- Mobile sidebar backdrop -->
        <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <div class="sidebar-brand">
                    <svg class="icon icon-amber" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16.5 9.4 7.55 4.24"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
                    <span>NORTHSTAR</span>
                </div>
                <button class="icon-btn sidebar-close" id="sidebar-close-btn" aria-label="Close sidebar">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>

            <div class="sidebar-new-chat-wrap">
                <button class="new-chat-btn" id="new-chat-btn">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                    New chat
                </button>
            </div>

            <div class="sidebar-stats">
                <span class="stat-chip stat-chip-amber">
                    <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></svg>
                    <span id="deflected-count">0</span>
                </span>
                <span class="stat-chip stat-chip-slate">
                    <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <span id="escalated-count">0</span>
                </span>
            </div>

            <p class="sidebar-offline-note" id="offline-note" hidden>Backend offline</p>

            <p class="sidebar-section-label">History</p>
            <div class="thread-list" id="thread-list"></div>
        </aside>

        <!-- Main column -->
        <div class="main-col">
            <header class="main-header">
                <button class="icon-btn sidebar-open" id="sidebar-open-btn" aria-label="Open history">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16"/><path d="M4 6h16"/><path d="M4 18h16"/></svg>
                </button>
                <div class="main-header-text">
                    <p class="main-header-title" id="thread-title">New conversation</p>
                    <p class="main-header-subtitle">Deflection MVP · v0.3</p>
                </div>
            </header>

            <main class="chat-log" id="chat-log"></main>

            <div class="category-bar-wrap">
                <div class="category-bar" id="category-bar">
                    <button class="category-chip" data-intent="order_status">
                        <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>
                        Track an order
                    </button>
                    <button class="category-chip" data-intent="returns_refund">
                        <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                        Return or refund
                    </button>
                    <button class="category-chip" data-intent="stock_availability">
                        <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                        Check stock
                    </button>
                    <button class="category-chip" data-intent="human">
                        <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        Talk to a human
                    </button>
                </div>
            </div>

            <div class="input-bar">
                <div class="input-bar-inner">
                    <input type="text" id="chat-input" class="chat-input" placeholder="Type your question..." autocomplete="off">
                    <button id="send-btn" class="send-btn" aria-label="Send message">
                        <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                        Send
                    </button>
                </div>
            </div>
        </div>

        <!-- Talk to a human modal -->
        <div class="modal-overlay" id="human-modal-overlay" hidden>
            <div class="modal-card">
                <div class="modal-header">
                    <div class="modal-header-title">
                        <svg class="icon icon-amber" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <span>Talk to a human</span>
                    </div>
                    <button class="icon-btn" id="modal-close-btn" aria-label="Close">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>
                </div>

                <div class="modal-body">
                    <p class="modal-copy">Leave your details and a message, a Northstar agent will follow up by email.</p>

                    <div class="form-field">
                        <label for="human-name">Name</label>
                        <input type="text" id="human-name" placeholder="Jane Doe">
                        <p class="form-error" id="human-name-error" hidden></p>
                    </div>

                    <div class="form-field">
                        <label for="human-email">Email</label>
                        <div class="input-with-icon">
                            <svg class="icon icon-sm input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                            <input type="email" id="human-email" placeholder="jane@example.com">
                        </div>
                        <p class="form-error" id="human-email-error" hidden></p>
                    </div>

                    <div class="form-field">
                        <label for="human-message">Message</label>
                        <textarea id="human-message" rows="3" placeholder="What do you need help with?"></textarea>
                        <p class="form-error" id="human-message-error" hidden></p>
                    </div>
                </div>

                <div class="modal-footer">
                    <button class="modal-btn modal-btn-secondary" id="modal-cancel-btn">Cancel</button>
                    <button class="modal-btn modal-btn-primary" id="modal-submit-btn">Send to agent</button>
                </div>
            </div>
        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
